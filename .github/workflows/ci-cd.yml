name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  test:
    runs-on: ubuntu-latest
    needs: security_scan

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eduai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+pg8000://postgres:postgres@localhost:5432/eduai_test
        run: alembic upgrade head

      - name: Run backend tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+pg8000://postgres:postgres@localhost:5432/eduai_test
          JWT_SECRET: ci-test-secret-key
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: 1440
          OPENAI_API_KEY: dummy-key-for-ci
          ENVIRONMENT: testing
          TESTING: "true"
        run: |
          pytest tests/ \
            --cov=app/services/wallet \
            --cov=app/auth \
            --cov=app/services/notification_service \
            --cov=app/services/gamification \
            --cov=app/services/goal_tracking \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests (Vitest)
        working-directory: frontend
        run: npx vitest run --reporter=verbose

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.1
        with:
          render-service-token: ${{ secrets.RENDER_SERVICE_TOKEN }}
          render-service-id: ${{ secrets.RENDER_SERVICE_ID }}
