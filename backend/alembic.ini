# Alembic configuration for EDUAI Learning
# This file is read by `alembic` commands.
# The actual database URL is overridden in alembic/env.py from the
# DATABASE_URL environment variable, so the value below is only used
# as a fallback for `alembic init` demos.

[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is overridden at runtime from DATABASE_URL in env.py.
# This placeholder keeps engine_from_config happy if env.py fails to set it.
sqlalchemy.url = postgresql+pg8000://localhost/placeholder

# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
