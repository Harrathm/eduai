services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: eduai
      POSTGRES_USER: eduai_user
      POSTGRES_PASSWORD: eduai_secure_pass_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduai_user -d eduai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+pg8000://eduai_user:eduai_secure_pass_2024@db:5432/eduai
      - JWT_SECRET=CHANGE_ME_USE_OPENSSL_RAND_BASE64_32
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=1440
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - STRIPE_PRICE_SCHOOL=${STRIPE_PRICE_SCHOOL}
      - STRIPE_PRICE_INSTITUTION=${STRIPE_PRICE_INSTITUTION}
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata: